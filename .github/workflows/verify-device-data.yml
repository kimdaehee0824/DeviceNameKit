name: Verify device data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for f in DeviceName/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (also verifies resource bundling)
        run: swift test
