name: Verify device data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure bundled data matches DeviceName/
        run: diff -ru DeviceName Sources/DeviceNameKit/Resources/DeviceName

      - name: Validate JSON files
        run: |
          for f in DeviceName/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
